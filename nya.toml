[app]
default_output = "text"
project_dir_name = ".nya-cli"

[web.search]
provider = "tavily"

[web.search.providers.tavily]
api_key_env = "TAVILY_API_KEY"
default_topic = "general"
default_search_depth = "basic"
rpm = 0
tpm = 0
retry_max_retries = 3
retry_delay_seconds = 10

[web.ingest]
provider = "scrapling"

[web.ingest.providers.scrapling]
command = "scrapling"
default_fetch_mode = "auto"
default_crawl = false
default_max_pages = 25
default_max_depth = 2
same_origin_only = true
min_markdown_chars = 200
get_timeout_seconds = 30
fetch_timeout_ms = 30000
fetch_wait_ms = 0
rpm = 0
tpm = 0
retry_max_retries = 3
retry_delay_seconds = 10

[web.ingest.providers.cloudflare]
account_id = ""
api_token_env = "CLOUDFLARE_API_TOKEN"
base_url = "https://api.cloudflare.com/client/v4"
default_fetch_mode = "auto"
default_crawl = false
default_max_pages = 25
default_max_depth = 2
min_markdown_chars = 200
poll_interval_ms = 5000
max_poll_attempts = 60
source = "all"
include_external_links = false
include_subdomains = false
include_patterns = []
exclude_patterns = []
rpm = 0
tpm = 0
retry_max_retries = 3
retry_delay_seconds = 10

[embedding]
provider = "openai"
model = "v5-small-retrieval"
task_type = "RETRIEVAL_DOCUMENT"

[embedding.providers.google]
api_key_env = "GOOGLE_GENERATIVE_AI_API_KEY"
output_dimensionality = 1536
rpm = 0
tpm = 0
retry_max_retries = 3
retry_delay_seconds = 10

[embedding.providers.openai]
api_key_env = "OPENAI_API_KEY"
base_url = "http://127.0.0.1:8080/v1"
dimensions = 1024
rpm = 0
tpm = 0
retry_max_retries = 3
retry_delay_seconds = 10

[rerank]
provider = "none"

[llm]
provider = "google"
model = "gemma-3-27b-it"

[llm.providers.google]
api_key_env = "GOOGLE_GENERATIVE_AI_API_KEY"
rpm = 0
tpm = 0
retry_max_retries = 3
retry_delay_seconds = 10

[llm.providers.openai]
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
rpm = 0
tpm = 0
retry_max_retries = 3
retry_delay_seconds = 10

[ai_search]
max_steps = 3
max_queries_per_step = 3
retrieval_limit = 8
max_evidence_chunks = 12

[index]
chunk_size = 1200
chunk_overlap = 150
chunking_version = "v1"
fts = true
vector = true
max_file_bytes = 262144
